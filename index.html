<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#07040d" />
<meta property="og:title" content="给 岳思晗" />
<meta property="og:description" content="有些话在心里放了很久，今天想认认真真说给你听。" />
<meta property="og:type" content="website" />
<title>给 岳思晗</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E%F0%9F%92%97%3C/text%3E%3C/svg%3E" />
<style>
  :root{
    --ink:#07040d;
    --rose:#ff7aa8;
    --peach:#ffb9a8;
    --gold:#ffd9a0;
    --lilac:#c0a2ff;
    /* 大标题的字色：想换成纯白就写 #ffffff，想偏金就写 #ffefd6 */
    --text-warm:#fff8f0;
    --serif:"Songti SC","STSong","Noto Serif SC","Source Han Serif SC","SimSun",serif;
    --sans:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  }

  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;overscroll-behavior:none;}
  body{
    background:var(--ink);
    color:#f6eefb;
    font-family:var(--sans);
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
    -webkit-tap-highlight-color:transparent;
  }

  /* ---------- 背景 ---------- */
  #sky{position:fixed;inset:0;z-index:0;display:block;}

  .aurora{position:fixed;inset:-20%;z-index:0;pointer-events:none;filter:blur(70px);opacity:.55;}
  .aurora i{position:absolute;display:block;border-radius:50%;mix-blend-mode:screen;}
  .aurora i:nth-child(1){
    width:52vmax;height:52vmax;left:-8vmax;top:-6vmax;
    background:radial-gradient(circle at 50% 50%,rgba(255,122,168,.55),transparent 62%);
    animation:drift1 26s ease-in-out infinite alternate;
  }
  .aurora i:nth-child(2){
    width:46vmax;height:46vmax;right:-10vmax;top:8vmax;
    background:radial-gradient(circle at 50% 50%,rgba(192,162,255,.48),transparent 64%);
    animation:drift2 32s ease-in-out infinite alternate;
  }
  .aurora i:nth-child(3){
    width:40vmax;height:40vmax;left:24vmax;bottom:-14vmax;
    background:radial-gradient(circle at 50% 50%,rgba(255,217,160,.38),transparent 66%);
    animation:drift3 29s ease-in-out infinite alternate;
  }
  @keyframes drift1{from{transform:translate3d(0,0,0) scale(1);}to{transform:translate3d(6vmax,4vmax,0) scale(1.14);}}
  @keyframes drift2{from{transform:translate3d(0,0,0) scale(1.05);}to{transform:translate3d(-7vmax,6vmax,0) scale(.92);}}
  @keyframes drift3{from{transform:translate3d(0,0,0) scale(.96);}to{transform:translate3d(4vmax,-6vmax,0) scale(1.1);}}

  #heart{position:fixed;inset:0;z-index:1;display:block;opacity:0;transition:opacity 1.8s ease;}
  #heart.show{opacity:1;}

  .vignette{
    position:fixed;inset:0;z-index:2;pointer-events:none;
    background:
      radial-gradient(120% 90% at 50% 46%,transparent 40%,rgba(7,4,13,.58) 100%),
      linear-gradient(180deg,rgba(7,4,13,.6),transparent 20%,transparent 80%,rgba(7,4,13,.7));
  }

  #fx{position:fixed;inset:0;z-index:4;display:block;pointer-events:none;}

  /* ---------- 舞台 ---------- */
  #app{position:relative;z-index:3;height:100%;}
  .stage{
    position:absolute;inset:0;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:clamp(16px,2.8vh,30px);
    padding:clamp(20px,5vw,56px);
    /* 微信底部工具条会盖住内容，给 iPhone 安全区留出空间 */
    padding-bottom:calc(clamp(20px,5vw,56px) + env(safe-area-inset-bottom, 0px));
    opacity:0;visibility:hidden;pointer-events:none;
    transform:translateY(24px) scale(.99);
    transition:opacity .95s ease,transform 1.05s cubic-bezier(.2,.7,.2,1),visibility .95s;
    overflow-y:auto;overscroll-behavior:contain;
    -webkit-overflow-scrolling:touch;
  }
  /* 内容比屏幕高时，从顶部开始排，避免被居中裁掉 */
  @supports (justify-content: safe center){
    .stage{justify-content:safe center;}
  }
  .stage.active{
    opacity:1;visibility:visible;pointer-events:auto;
    transform:translateY(0) scale(1);
  }

  /* ---------- 第一幕 ---------- */
  .eyebrow{
    display:flex;align-items:center;gap:16px;
    font-size:clamp(10px,2.5vw,13px);
    letter-spacing:.42em;text-indent:.42em;
    color:rgba(255,217,160,.82);
  }
  .eyebrow .line{
    width:clamp(24px,8vw,60px);height:1px;
    background:linear-gradient(90deg,transparent,rgba(255,217,160,.7));
  }
  .eyebrow .line:last-child{background:linear-gradient(90deg,rgba(255,217,160,.7),transparent);}

  .name{
    font-family:var(--serif);
    font-size:clamp(3.2rem,16vw,9rem);
    font-weight:600;
    line-height:1.06;
    letter-spacing:.05em;
    color:var(--text-warm);
    text-shadow:
      0 0 1px rgba(255,255,255,.5),
      0 0 26px rgba(255,214,170,.30),
      0 0 70px rgba(255,150,190,.20);
    animation:glowPulse 7s ease-in-out infinite;
  }
  @keyframes glowPulse{
    0%,100%{
      text-shadow:
        0 0 1px rgba(255,255,255,.45),
        0 0 24px rgba(255,214,170,.24),
        0 0 64px rgba(255,150,190,.16);
    }
    50%{
      text-shadow:
        0 0 1px rgba(255,255,255,.62),
        0 0 34px rgba(255,214,170,.40),
        0 0 96px rgba(255,150,190,.26);
    }
  }

  .subtitle{
    font-family:var(--serif);
    font-size:clamp(14px,4vw,21px);
    letter-spacing:.14em;
    color:rgba(246,238,251,.76);
    text-align:center;
    line-height:1.95;
  }

  .days{
    font-size:clamp(10px,2.9vw,13px);
    letter-spacing:.22em;
    color:rgba(255,185,168,.72);
  }
  .days b{font-weight:600;color:rgba(255,217,160,.95);font-variant-numeric:tabular-nums;}

  .btn{
    position:relative;
    margin-top:clamp(4px,1.6vh,14px);
    padding:clamp(11px,2.3vw,15px) clamp(24px,6.5vw,40px);
    border:1px solid rgba(255,217,160,.42);
    border-radius:999px;
    background:linear-gradient(160deg,rgba(255,255,255,.10),rgba(255,255,255,.028));
    color:#ffeada;
    font-family:var(--serif);
    font-size:clamp(13px,3.5vw,17px);
    letter-spacing:.24em;text-indent:.24em;
    cursor:pointer;
    -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
    box-shadow:0 14px 40px rgba(0,0,0,.42),inset 0 1px 0 rgba(255,255,255,.20);
    transition:transform .45s cubic-bezier(.2,.7,.2,1),box-shadow .45s ease,border-color .45s ease,background .45s ease;
  }
  .btn:hover,.btn:focus-visible{
    transform:translateY(-3px);
    border-color:rgba(255,185,168,.85);
    background:linear-gradient(160deg,rgba(255,122,168,.22),rgba(255,217,160,.10));
    box-shadow:0 20px 52px rgba(255,122,168,.32),inset 0 1px 0 rgba(255,255,255,.30);
    outline:none;
  }
  .btn:active{transform:translateY(-1px) scale(.985);}

  .hint{
    font-size:clamp(9px,2.5vw,11px);
    letter-spacing:.3em;text-indent:.3em;
    color:rgba(246,238,251,.32);
  }

  /* ---------- 第二幕 · 信 ---------- */
  .letter{
    position:relative;
    width:min(660px,92vw);
    max-height:76vh;
    overflow-y:auto;
    padding:clamp(24px,5.4vw,46px) clamp(22px,5.4vw,48px);
    border-radius:clamp(18px,4vw,26px);
    background:linear-gradient(158deg,rgba(255,255,255,.115),rgba(255,255,255,.028) 62%,rgba(192,162,255,.07));
    border:1px solid rgba(255,255,255,.145);
    -webkit-backdrop-filter:blur(22px) saturate(145%);backdrop-filter:blur(22px) saturate(145%);
    box-shadow:0 34px 90px rgba(0,0,0,.52),inset 0 1px 0 rgba(255,255,255,.20),
               inset 0 26px 26px -26px rgba(7,4,13,.75),
               inset 0 -26px 26px -26px rgba(7,4,13,.85);
    scrollbar-width:thin;
    scrollbar-color:rgba(255,217,160,.35) transparent;
  }
  .letter::-webkit-scrollbar{width:5px;}
  .letter::-webkit-scrollbar-thumb{
    background:linear-gradient(180deg,rgba(255,217,160,.5),rgba(255,122,168,.4));
    border-radius:99px;
  }
  .letter::before{
    content:"";position:absolute;left:12%;right:12%;top:0;height:1px;
    background:linear-gradient(90deg,transparent,rgba(255,217,160,.75),transparent);
    pointer-events:none;
  }

  .letter-to{
    font-family:var(--serif);
    font-size:clamp(18px,4.8vw,25px);
    letter-spacing:.12em;
    color:rgba(255,217,160,.94);
    margin-bottom:clamp(12px,2.6vh,22px);
  }
  .letter-to span{color:rgba(255,122,168,.95);}

  .para{
    font-family:var(--serif);
    font-size:clamp(14px,3.7vw,17px);
    line-height:2.05;
    letter-spacing:.04em;
    color:rgba(246,238,251,.91);
    margin-bottom:clamp(12px,2.4vh,18px);
  }
  .para:last-child{margin-bottom:0;}

  /* 打字光标：细竖线 */
  .caret{
    display:inline-block;width:2px;height:1em;
    margin-left:2px;vertical-align:-.12em;
    background:linear-gradient(180deg,rgba(255,217,160,.95),rgba(255,122,168,.9));
    border-radius:1px;
    animation:blink 1.05s steps(1) infinite;
  }
  @keyframes blink{0%,50%{opacity:1;}50.01%,100%{opacity:0;}}

  .sign{
    margin-top:clamp(16px,3.4vh,28px);
    text-align:right;
    font-family:var(--serif);
    font-size:clamp(12px,3.3vw,14px);
    letter-spacing:.1em;
    color:rgba(255,185,168,.82);
    opacity:0;transition:opacity 1.2s ease;
  }
  .sign.in{opacity:1;}

  .letter-actions{
    display:flex;justify-content:center;
    margin-top:clamp(6px,1.4vh,12px);
  }

  /* ---------- 第三幕 · 照片墙 ---------- */
  .gallery{
    width:min(640px,94vw);
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:clamp(12px,2.4vw,18px);
    padding:2px 6px 6px 2px;
    align-items:start;
  }

  .photo{
    margin:0;
    padding:6px;
    border-radius:14px;
    background:linear-gradient(160deg,rgba(255,255,255,.14),rgba(255,255,255,.05));
    border:1px solid rgba(255,255,255,.17);
    box-shadow:0 16px 40px rgba(0,0,0,.48),inset 0 1px 0 rgba(255,255,255,.20);
    opacity:0;
    transform:translateY(18px) scale(.97) rotate(var(--tilt,0deg));
  }
  .photo img{
    display:block;
    width:100%;height:auto;
    border-radius:9px;
    filter:saturate(1.03) contrast(1.02);
  }
  .photo figcaption{
    padding:9px 4px 3px;
    text-align:center;
    font-family:var(--serif);
    font-size:clamp(11px,2.8vw,13px);
    letter-spacing:.16em;text-indent:.16em;
    color:rgba(255,214,170,.80);
  }

  .stage.active .photo{animation:photoIn .95s cubic-bezier(.2,.7,.2,1) forwards;}
  .stage.active .photo:nth-child(1){animation-delay:.10s;}
  .stage.active .photo:nth-child(2){animation-delay:.24s;}
  .stage.active .photo:nth-child(3){animation-delay:.38s;}
  .stage.active .photo:nth-child(4){animation-delay:.52s;}
  @keyframes photoIn{
    to{opacity:1;transform:translateY(0) scale(1) rotate(var(--tilt,0deg));}
  }

  @media (max-width:520px){
    .gallery{max-height:66vh;gap:10px;padding-right:4px;}
    .photo{padding:5px;border-radius:12px;}
  }

  /* 老版安卓微信内核不支持毛玻璃时，用不透明的深紫底代替，保证文字仍然清楚 */
  @supports not ((backdrop-filter: blur(2px)) or (-webkit-backdrop-filter: blur(2px))){
    .letter{
      background:linear-gradient(158deg,rgba(44,30,58,.94),rgba(30,21,44,.93) 62%,rgba(52,35,72,.93));
      border-color:rgba(255,220,190,.22);
    }
  }

  .finale-title{
    font-family:var(--serif);
    font-size:clamp(2.1rem,7.6vw,3.9rem);
    font-weight:600;
    line-height:1.22;
    letter-spacing:.10em;
    text-align:center;
    color:var(--text-warm);
    text-shadow:
      0 0 22px rgba(255,214,170,.28),
      0 0 62px rgba(255,150,190,.20);
    animation:glowPulse 8s ease-in-out infinite;
  }

  /* 爱心区域：占满剩余空间，粒子爱心以其中的按钮为中心生成 */
  .heart-zone{
    flex:1 1 auto;
    width:100%;
    min-height:clamp(180px,26vh,340px);
    display:grid;place-items:center;
  }

  .finale-caption{
    font-family:var(--serif);
    font-size:clamp(13px,3.6vw,18px);
    letter-spacing:.12em;
    line-height:1.95;
    color:rgba(246,238,251,.84);
    text-align:center;
    max-width:min(540px,88vw);
    min-height:2.4em;
    transition:opacity .55s ease,transform .55s ease;
  }
  .finale-caption.swap{opacity:0;transform:translateY(8px);}

  .finale-small{
    font-size:clamp(9px,2.7vw,12px);
    letter-spacing:.26em;text-indent:.26em;
    color:rgba(255,217,160,.6);
    text-align:center;
    min-height:1.4em;
    transition:color .6s ease;
  }

  .heart-btn{
    width:clamp(60px,16vw,82px);height:clamp(60px,16vw,82px);
    border-radius:50%;
    border:1px solid rgba(255,185,168,.55);
    background:radial-gradient(circle at 34% 28%,rgba(255,255,255,.24),rgba(255,122,168,.18) 58%,rgba(255,217,160,.10));
    -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
    cursor:pointer;display:grid;place-items:center;
    font-size:clamp(19px,5.2vw,25px);
    box-shadow:0 16px 48px rgba(255,122,168,.30),inset 0 1px 0 rgba(255,255,255,.32);
    transition:transform .5s cubic-bezier(.2,.7,.2,1),box-shadow .5s ease;
    animation:beat 1.8s ease-in-out infinite;
  }
  .heart-btn:hover,.heart-btn:focus-visible{
    transform:scale(1.08);outline:none;
    box-shadow:0 22px 64px rgba(255,122,168,.5),inset 0 1px 0 rgba(255,255,255,.42);
  }
  @keyframes beat{
    0%,100%{transform:scale(1);}
    14%{transform:scale(1.08);}
    28%{transform:scale(1);}
    42%{transform:scale(1.05);}
    56%{transform:scale(1);}
  }

  .replay{
    background:none;border:none;cursor:pointer;
    color:rgba(246,238,251,.32);
    font-family:var(--sans);
    font-size:clamp(9px,2.5vw,11px);
    letter-spacing:.24em;text-indent:.24em;
    transition:color .4s ease;
    padding:6px;
  }
  .replay:hover{color:rgba(255,217,160,.8);}

  /* 窄屏：让信纸多占一点高度，减少滚动 */
  @media (max-width:520px){
    .letter{max-height:72vh;}
    .stage{padding:16px 14px;}
    .para{line-height:1.95;}
  }
  @media (max-height:660px){
    .stage{gap:12px;padding:14px;}
    .letter{max-height:78vh;}
    .heart-zone{min-height:150px;}
  }

  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important;}
  }
</style>
</head>
<body>

<canvas id="sky" aria-hidden="true"></canvas>
<div class="aurora" aria-hidden="true"><i></i><i></i><i></i></div>
<canvas id="heart" aria-hidden="true"></canvas>
<div class="vignette" aria-hidden="true"></div>
<canvas id="fx" aria-hidden="true"></canvas>

<main id="app">

  <!-- ======== 第一幕 ======== -->
  <section class="stage active" id="stage-1" aria-label="开场">
    <div class="eyebrow"><span class="line"></span>致 我 最 爱 的 女 孩<span class="line"></span></div>
    <h1 class="name">岳思晗</h1>
    <p class="days" id="days" hidden></p>
    <p class="subtitle">有些话在心里放了很久<br>今天想认认真真，说给你听</p>
    <button class="btn" data-goto="2">打 开 这 封 信</button>
    <p class="hint">轻触屏幕，慢慢看</p>
  </section>

  <!-- ======== 第二幕 ======== -->
  <section class="stage" id="stage-2" aria-label="信">
    <article class="letter" id="letter">
      <p class="letter-to">思晗<span>，</span></p>
      <div id="letterBody"></div>
      <p class="sign" id="sign"></p>
    </article>
    <div class="letter-actions">
      <button class="btn" data-goto="3" id="toFinale" hidden>还 有 几 张 照 片</button>
    </div>
  </section>

  <!-- ======== 第三幕 · 照片墙 ======== -->
  <section class="stage" id="stage-3" aria-label="我们的照片">
    <div class="eyebrow"><span class="line"></span>我 们 的 一 些 片 段<span class="line"></span></div>
    <div class="gallery" id="gallery">
      <!--PHOTOS-START-->

      "我喜欢你笑起来的样子，喜欢你讲起喜欢的事时那股认真劲儿，也喜欢你偶尔赖在我旁边、把一件小事讲成整个故事的模样。你笑时眉眼弯弯，你认真时眼里有光；你赖在我旁边时，琐碎有了章节，小事也能讲成很长的故事。",
      "我没什么惊天动地的誓言给你。不必惊天动地，只愿细水长流；不必山盟海誓，只愿朝朝暮暮。 我只想在每一个平常的日子里，做那个你一个眼神递过来就懂你的人，做那个记得你喜欢吃芭乐、喜欢喝牛奶的人，做那个在你难过时先站到你这边的人。",
      "往后的路还很长，我想牵着你，一年一年地走下去。路长不怕，怕的是没有你；日子平常不怕，平常里有你，便年年都有盼头。",
      "岳思晗，我喜欢你。不是一时兴起，是想了很多很多遍之后，依然坚定的那种喜欢。不是风起时的一时心动，是风停后依然想走向你的笃定。"
    ],

    // 落款
    sign: "—— 那个想陪你很久很久的孙若宸",

    // 第三幕
    finaleCaption: "这句话我想说很多年，<br>从今天开始，每天都算一次。",
    heartHint: "按 一 下 心 脏",
    afterReply: "那说好了，一辈子都算数。",
    afterReplyHint: "已 收 到 你 的 回 答 ❤"
  };
  /* =================================================================== */

  const $ = (s, r) => (r || document).querySelector(s);
  const $$ = (s, r) => Array.prototype.slice.call((r || document).querySelectorAll(s));
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* ---------------- 名字 & 在一起的天数 ---------------- */
  document.title = "给 " + CONFIG.herName;
  if (CONFIG.startDate) {
    const start = new Date(CONFIG.startDate + "T00:00:00");
    const diff = Math.floor((Date.now() - start.getTime()) / 86400000);
    if (!isNaN(diff) && diff >= 0) {
      const el = $("#days");
      el.hidden = false;
      el.innerHTML = "我 们 已 经 在 一 起 <b>" + diff + "</b> 天 了";
    }
  }

  /* ================= 画布 ================= */
  const skyC = $("#sky"), heartC = $("#heart"), fxC = $("#fx");
  const sctx = skyC.getContext("2d");
  const hctx = heartC.getContext("2d");
  const fctx = fxC.getContext("2d");

  let W = 0, H = 0, DPR = 1;

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    [skyC, heartC, fxC].forEach(function (c) {
      c.width = Math.round(W * DPR);
      c.height = Math.round(H * DPR);
      c.style.width = W + "px";
      c.style.height = H + "px";
      c.getContext("2d").setTransform(DPR, 0, 0, DPR, 0, 0);
    });
    buildStars();
  }

  /* ================= 星空 ================= */
  let stars = [], dust = [], shooting = [], nextShoot = 240;
  let t0 = performance.now();

  function buildStars() {
    const area = W * H;
    stars = [];
    const n = Math.min(180, Math.round(area / 9500));
    for (let i = 0; i < n; i++) {
      stars.push({
        x: Math.random() * W,
        y: Math.random() * H,
        r: Math.random() * 1.3 + 0.35,
        a: Math.random() * 0.55 + 0.18,
        tw: Math.random() * Math.PI * 2,
        sp: Math.random() * 0.0016 + 0.0005,
        hue: Math.random() < 0.34 ? 340 : (Math.random() < 0.5 ? 40 : 265)
      });
    }
    dust = [];
    const m = Math.min(24, Math.round(area / 66000));
    for (let i = 0; i < m; i++) {
      dust.push({
        x: Math.random() * W,
        y: Math.random() * H,
        r: Math.random() * 2.4 + 1.0,
        vx: (Math.random() - 0.5) * 0.14,
        vy: -(Math.random() * 0.16 + 0.05),
        a: Math.random() * 0.3 + 0.08,
        ph: Math.random() * Math.PI * 2
      });
    }
  }

  function drawSky(now) {
    const t = now - t0;
    sctx.clearRect(0, 0, W, H);

    for (let i = 0; i < stars.length; i++) {
      const s = stars[i];
      const tw = 0.55 + 0.45 * Math.sin(t * s.sp + s.tw);
      sctx.beginPath();
      sctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      sctx.fillStyle = "hsla(" + s.hue + ",92%,86%," + (s.a * tw).toFixed(3) + ")";
      sctx.fill();
    }

    for (let i = 0; i < dust.length; i++) {
      const d = dust[i];
      d.x += d.vx; d.y += d.vy;
      if (d.y < -20) { d.y = H + 20; d.x = Math.random() * W; }
      if (d.x < -20) d.x = W + 20;
      if (d.x > W + 20) d.x = -20;

      const pulse = 0.6 + 0.4 * Math.sin(t * 0.0012 + d.ph);
      const rad = d.r * 4.2;
      const g = sctx.createRadialGradient(d.x, d.y, 0, d.x, d.y, rad);
      g.addColorStop(0, "rgba(255,222,196," + (d.a * pulse).toFixed(3) + ")");
      g.addColorStop(0.45, "rgba(255,140,180," + (d.a * pulse * 0.32).toFixed(3) + ")");
      g.addColorStop(1, "rgba(255,140,180,0)");
      sctx.fillStyle = g;
      sctx.beginPath();
      sctx.arc(d.x, d.y, rad, 0, Math.PI * 2);
      sctx.fill();
    }

    if (!reduceMotion) {
      nextShoot -= 16;
      if (nextShoot <= 0) {
        nextShoot = 700 + Math.random() * 1100;
        shooting.push({
          x: Math.random() * W * 0.75,
          y: Math.random() * H * 0.4,
          len: 90 + Math.random() * 110,
          sp: 7 + Math.random() * 5,
          life: 1
        });
      }
      for (let i = shooting.length - 1; i >= 0; i--) {
        const s = shooting[i];
        s.x += s.sp; s.y += s.sp * 0.42; s.life -= 0.009;
        if (s.life <= 0) { shooting.splice(i, 1); continue; }
        const g = sctx.createLinearGradient(s.x, s.y, s.x - s.len, s.y - s.len * 0.42);
        g.addColorStop(0, "rgba(255,244,230," + (0.8 * s.life).toFixed(3) + ")");
        g.addColorStop(1, "rgba(255,244,230,0)");
        sctx.strokeStyle = g;
        sctx.lineWidth = 1.4;
        sctx.beginPath();
        sctx.moveTo(s.x, s.y);
        sctx.lineTo(s.x - s.len, s.y - s.len * 0.42);
        sctx.stroke();
      }
    }
  }

  /* ================= 满屏繁星 → 汇聚成爱心 ================= */
  const HP = [];
  let heartOn = false, heartStart = 0, heartBeat = 1;
  let heartCx = 0, heartCy = 0, heartScale = 180;
  const HOLD = 850;   // 先让星星铺满屏幕亮一会儿，再开始汇聚

  // 经典心形隐函数：(x²+y²−1)³ − x²y³ ≤ 0
  function inHeart(x, y) {
    const a = x * x + y * y - 1;
    return a * a * a - x * x * y * y * y <= 0;
  }

  // 从中心沿某个方向二分找边界，用来做「偏向轮廓」的分布
  function heartEdge(theta) {
    const dx = Math.cos(theta), dy = Math.sin(theta);
    let lo = 0, hi = 1.4;
    for (let i = 0; i < 22; i++) {
      const mid = (lo + hi) / 2;
      if (inHeart(dx * mid, dy * mid)) lo = mid; else hi = mid;
    }
    return lo;
  }

  /* 两种精灵：柔和光点 + 十字星芒。预渲染比每帧建渐变快得多 */
  function makeDot(rgb) {
    const S = 48, c = document.createElement("canvas");
    c.width = c.height = S;
    const x = c.getContext("2d");
    const g = x.createRadialGradient(S / 2, S / 2, 0, S / 2, S / 2, S / 2);
    g.addColorStop(0, "rgba(" + rgb + ",1)");
    g.addColorStop(0.10, "rgba(" + rgb + ",.92)");
    g.addColorStop(0.30, "rgba(" + rgb + ",.26)");
    g.addColorStop(0.62, "rgba(" + rgb + ",.06)");
    g.addColorStop(1, "rgba(" + rgb + ",0)");
    x.fillStyle = g;
    x.fillRect(0, 0, S, S);
    return c;
  }

  function makeSparkle(rgb) {
    const S = 96, c = document.createElement("canvas");
    c.width = c.height = S;
    const x = c.getContext("2d");
    const h = S / 2;

    const g = x.createRadialGradient(h, h, 0, h, h, h * 0.28);
    g.addColorStop(0, "rgba(255,255,255,1)");
    g.addColorStop(0.38, "rgba(" + rgb + ",.8)");
    g.addColorStop(1, "rgba(" + rgb + ",0)");
    x.fillStyle = g;
    x.beginPath();
    x.arc(h, h, h * 0.28, 0, Math.PI * 2);
    x.fill();

    // 横向、纵向各一道光芒，形成十字星
    function arm(horizontal) {
      const lg = horizontal
        ? x.createLinearGradient(0, h, S, h)
        : x.createLinearGradient(h, 0, h, S);
      lg.addColorStop(0, "rgba(" + rgb + ",0)");
      lg.addColorStop(0.5, "rgba(255,255,255,.9)");
      lg.addColorStop(1, "rgba(" + rgb + ",0)");
      x.fillStyle = lg;
      if (horizontal) x.fillRect(0, h - 1.1, S, 2.2);
      else x.fillRect(h - 1.1, 0, 2.2, S);
    }
    arm(true);
    arm(false);
    return c;
  }

  const IVORY = "255,247,236", GOLD = "255,221,170", ROSE = "255,196,214";
  const DOT = [makeDot(IVORY), makeDot(GOLD), makeDot(ROSE)];
  const STAR = [makeSparkle(IVORY), makeSparkle(GOLD)];

  function buildHeart() {
    // 以「爱心按钮」为中心生成，保证心形正好包住按钮
    const zone = $("#heartZone");
    const zr = zone.getBoundingClientRect();
    const zw = zr.width || W * 0.6;
    const zh = zr.height || H * 0.3;

    heartCx = zr.width ? zr.left + zr.width / 2 : W / 2;
    heartCy = zr.height ? zr.top + zr.height / 2 : H * 0.55;
    // 心形半宽约 1.14·s、上半高约 1.24·s、下半高约 1.0·s
    const maxByWidth = (W / 2 - Math.max(22, W * 0.10)) / 1.16;
    heartScale = Math.max(56, Math.min(zw * 0.40, zh * 0.42, maxByWidth, 220));

    HP.length = 0;
    const count = W < 620 ? 700 : 1120;

    for (let i = 0; i < count; i++) {
      const theta = Math.random() * Math.PI * 2;
      const edge = heartEdge(theta);
      // 六成星星贴紧轮廓（勾勒心形），四成散在内部（柔和填充）
      const u = Math.random() < 0.62
        ? 0.92 + Math.random() * 0.08
        : 0.34 + Math.random() * 0.54;
      const r = edge * u;
      const hx = Math.cos(theta) * r;
      const hy = Math.sin(theta) * r;

      const tx = heartCx + hx * heartScale;
      const ty = heartCy - hy * heartScale;

      // 起点：铺满整屏（略微溢出边界）
      const sx = -W * 0.05 + Math.random() * W * 1.10;
      const sy = -H * 0.05 + Math.random() * H * 1.10;

      // 弧线控制点：让星星沿弧线飞入，而不是笔直冲过来
      const mx = (sx + tx) / 2, my = (sy + ty) / 2;
      const nx = -(ty - sy), ny = (tx - sx);
      const nl = Math.sqrt(nx * nx + ny * ny) || 1;
      const bend = (Math.random() * 2 - 1) * Math.min(260, nl * 0.32);

      const isStar = Math.random() < 0.14;
      const roll = Math.random();
      const palIdx = roll < 0.66 ? 0 : (roll < 0.90 ? 1 : 2);

      HP.push({
        tx: tx, ty: ty,
        sx: sx, sy: sy,
        cx: mx + (nx / nl) * bend,
        cy: my + (ny / nl) * bend,
        x: sx, y: sy, px: sx, py: sy,
        delay: HOLD + Math.random() * 620,
        dur: 1150 + Math.random() * 850,
        size: isStar ? (Math.random() * 12 + 10) : (Math.random() * 3.2 + 2.8),
        sprite: isStar ? STAR[palIdx === 2 ? 1 : palIdx] : DOT[palIdx],
        base: 0.52 + Math.random() * 0.44,
        ph: Math.random() * Math.PI * 2
      });
    }
  }

  // 先慢后慢的缓动：起手不猛冲，落位自然停住
  function easeIO(k) {
    return k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
  }

  function drawHeart(now) {
    if (!heartOn) return;
    const el = now - heartStart;
    hctx.clearRect(0, 0, W, H);

    const br = heartBeat;
    // 心跳做得比之前轻，避免"塑料感"
    const beat = 1 + (0.020 * Math.sin(el / (660 / br)) + 0.008 * Math.sin(el / (290 / br)));

    // 心形内部一层极淡的柔光
    const glowR = heartScale * 1.30 * beat;
    const gGlow = hctx.createRadialGradient(heartCx, heartCy, heartScale * 0.10, heartCx, heartCy, glowR);
    gGlow.addColorStop(0, "rgba(255,238,222,.10)");
    gGlow.addColorStop(0.50, "rgba(255,172,200,.045)");
    gGlow.addColorStop(1, "rgba(255,150,190,0)");
    hctx.fillStyle = gGlow;
    hctx.beginPath();
    hctx.arc(heartCx, heartCy, glowR, 0, Math.PI * 2);
    hctx.fill();

    hctx.globalCompositeOperation = "lighter";
    hctx.lineCap = "round";

    for (let i = 0; i < HP.length; i++) {
      const p = HP[i];

      const raw = (el - p.delay) / p.dur;
      const k = raw <= 0 ? 0 : (raw >= 1 ? 1 : raw);
      const e = easeIO(k);

      const ax = heartCx + (p.tx - heartCx) * beat;
      const ay = heartCy + (p.ty - heartCy) * beat;
      const inv = 1 - e;
      p.x = inv * inv * p.sx + 2 * inv * e * p.cx + e * e * ax;
      p.y = inv * inv * p.sy + 2 * inv * e * p.cy + e * e * ay;

      // 拖尾：回看固定 35ms 的位移，帧率高低都不变形
      if (k > 0 && k < 1) {
        const e2 = easeIO(k > 0.035 ? k - 0.035 : 0);
        const inv2 = 1 - e2;
        const x2 = inv2 * inv2 * p.sx + 2 * inv2 * e2 * p.cx + e2 * e2 * ax;
        const y2 = inv2 * inv2 * p.sy + 2 * inv2 * e2 * p.cy + e2 * e2 * ay;
        const ddx = p.x - x2, ddy = p.y - y2;
        if (ddx * ddx + ddy * ddy > 3) {
          hctx.strokeStyle = "rgba(255,242,228," + (0.10 + 0.26 * p.base).toFixed(3) + ")";
          hctx.lineWidth = 1;
          hctx.beginPath();
          hctx.moveTo(x2, y2);
          hctx.lineTo(p.x, p.y);
          hctx.stroke();
        }
      }

      const twinkle = 0.62 + 0.38 * Math.sin(el * 0.0032 + p.ph);
      const alpha = p.base * twinkle * (k > 0 ? 1 : 0.9);
      if (alpha <= 0.02) continue;

      const s = p.size;
      hctx.globalAlpha = alpha;
      hctx.drawImage(p.sprite, p.x - s / 2, p.y - s / 2, s, s);
    }
    hctx.globalAlpha = 1;
    hctx.globalCompositeOperation = "source-over";
  }

  /* ================= 烟花 ================= */
  const sparks = [];

  function burst(x, y, hue) {
    const n = W < 620 ? 40 : 58;
    for (let i = 0; i < n; i++) {
      const ang = (Math.PI * 2 * i) / n + Math.random() * 0.3;
      const spd = Math.random() * 4.2 + 1.4;
      sparks.push({
        x: x, y: y,
        vx: Math.cos(ang) * spd,
        vy: Math.sin(ang) * spd - 0.6,
        life: 1,
        decay: 0.012 + Math.random() * 0.012,
        hue: hue + (Math.random() * 34 - 17),
        r: Math.random() * 1.6 + 0.7
      });
    }
  }

  function drawFx() {
    fctx.clearRect(0, 0, W, H);
    if (!sparks.length) return;
    fctx.globalCompositeOperation = "lighter";
    for (let i = sparks.length - 1; i >= 0; i--) {
      const s = sparks[i];
      const px = s.x, py = s.y;
      s.vy += 0.045; s.vx *= 0.985; s.vy *= 0.985;
      s.x += s.vx; s.y += s.vy;
      s.life -= s.decay;
      if (s.life <= 0) { sparks.splice(i, 1); continue; }

      const a = Math.max(0, s.life);

      // 拖尾：让火花看起来在飞，而不是一团光球
      fctx.strokeStyle = "hsla(" + s.hue + ",100%,80%," + (a * 0.5).toFixed(3) + ")";
      fctx.lineWidth = Math.max(0.8, s.r * 0.9);
      fctx.beginPath();
      fctx.moveTo(px, py);
      fctx.lineTo(s.x, s.y);
      fctx.stroke();

      const rad = s.r * 3.6;
      const g = fctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, rad);
      g.addColorStop(0, "hsla(" + s.hue + ",100%,90%," + (a * 0.95).toFixed(3) + ")");
      g.addColorStop(0.4, "hsla(" + s.hue + ",100%,72%," + (a * 0.28).toFixed(3) + ")");
      g.addColorStop(1, "hsla(" + s.hue + ",100%,64%,0)");
      fctx.fillStyle = g;
      fctx.beginPath();
      fctx.arc(s.x, s.y, rad, 0, Math.PI * 2);
      fctx.fill();
    }
    fctx.globalCompositeOperation = "source-over";
  }

  function loop(now) {
    drawSky(now);
    drawHeart(now);
    drawFx();
    requestAnimationFrame(loop);
  }

  /* ================= 场景切换 ================= */
  let typingToken = 0, typedOnce = false;

  function go(n) {
    $$(".stage").forEach(function (s) { s.classList.remove("active"); });
    const target = $("#stage-" + n);
    if (target) target.classList.add("active");
    if (n === 2 && !typedOnce) startLetter();
    if (n === 4) startFinale();
    const gal = $("#gallery");
    if (gal) gal.scrollTop = 0;
  }

  /* ---------- 让光标始终留在可视区域内 ---------- */
  function keepCaretVisible(box, caret) {
    const c = caret.getBoundingClientRect();
    const b = box.getBoundingClientRect();
    const pad = 14;
    if (c.bottom > b.bottom - pad) {
      box.scrollTop += (c.bottom - b.bottom) + pad;
    } else if (c.top < b.top + pad) {
      box.scrollTop -= (b.top - c.top) + pad;
    }
  }

  function paintInstant(body) {
    body.innerHTML = "";
    CONFIG.letter.forEach(function (txt) {
      const p = document.createElement("p");
      p.className = "para";
      p.textContent = txt;
      body.appendChild(p);
    });
  }

  /* ---------- 第二幕：打字机 ---------- */
  async function startLetter() {
    typedOnce = true;
    const token = ++typingToken;
    const body = $("#letterBody");
    const signEl = $("#sign");
    const nextBtn = $("#toFinale");
    const box = $("#letter");

    body.innerHTML = "";
    signEl.textContent = CONFIG.sign;
    signEl.classList.remove("in");
    nextBtn.hidden = true;
    box.scrollTop = 0;

    // 点信纸可以跳过逐字动画
    function onSkip() { typingToken++; box.removeEventListener("click", onSkip); }
    box.addEventListener("click", onSkip);

    // 跳过时先给一个即时版本，避免中途空白
    let skipped = false;
    const checkSkip = function () {
      if (!skipped && token !== typingToken) { skipped = true; return true; }
      return false;
    };

    for (let i = 0; i < CONFIG.letter.length; i++) {
      if (token !== typingToken) break;

      const p = document.createElement("p");
      p.className = "para";
      const textNode = document.createTextNode("");
      p.appendChild(textNode);
      const caret = document.createElement("span");
      caret.className = "caret";
      p.appendChild(caret);
      body.appendChild(p);
      keepCaretVisible(box, caret);

      const chars = Array.from(CONFIG.letter[i]);
      for (let k = 0; k < chars.length; k++) {
        if (token !== typingToken) break;
        textNode.nodeValue += chars[k];
        const ch = chars[k];
        let wait = 40 + Math.random() * 38;
        if ("，、；：".indexOf(ch) >= 0) wait += 140;
        if ("。？！".indexOf(ch) >= 0) wait += 260;
        await sleep(wait);
        keepCaretVisible(box, caret);
      }
      caret.remove();

      if (token !== typingToken) {
        textNode.nodeValue = CONFIG.letter[i];
        break;
      }
      await sleep(220);
    }

    // 被跳过 / 中断：一次性补全
    if (checkSkip()) {
      paintInstant(body);
    }

    signEl.classList.add("in");
    nextBtn.hidden = false;
    box.scrollTop = 0;
  }

  /* ---------- 第三幕 ---------- */
  let heartStarted = false, replied = false;

  function startFinale() {
    if (heartStarted) return;
    heartStarted = true;
    heartBeat = 1;
    $("#finaleCaption").innerHTML = CONFIG.finaleCaption;
    $("#finaleCaption").classList.remove("swap");
    $("#finaleSmall").textContent = CONFIG.heartHint;
    // 等布局稳定后再按按钮位置生成爱心
    requestAnimationFrame(function () {
      buildHeart();
      heartC.classList.add("show");
      heartOn = true;
      heartStart = performance.now();
    });
  }

  /* ---------- 交互 ---------- */
  $$("[data-goto]").forEach(function (b) {
    b.addEventListener("click", function (e) {
      e.stopPropagation();
      go(parseInt(b.getAttribute("data-goto"), 10));
    });
  });

  $("#stage-1").addEventListener("click", function (e) {
    if (e.target.closest("button")) return;
    go(2);
  });

  $("#heartBtn").addEventListener("click", async function () {
    if (replied) {
      burst(W * (0.2 + Math.random() * 0.25), H * (0.16 + Math.random() * 0.22), 330 + Math.random() * 40);
      return;
    }
    replied = true;
    heartBeat = 1.55;   // 心跳加快

    const cap = $("#finaleCaption");
    cap.classList.add("swap");
    await sleep(420);
    cap.innerHTML = CONFIG.afterReply;
    cap.classList.remove("swap");
    $("#finaleSmall").textContent = CONFIG.afterReplyHint;
    $("#finaleSmall").style.color = "rgba(255,185,168,.8)";
    $("#heartBtn").style.animation = "none";

    // 烟花放在画面两侧与上方，避开中间的文字和爱心
    const colors = [340, 350, 30, 285];
    burst(W * 0.22, H * 0.30, colors[0]);
    setTimeout(function () { burst(W * 0.78, H * 0.26, colors[2]); }, 250);
    setTimeout(function () { burst(W * 0.11, H * 0.55, colors[3]); }, 500);
    setTimeout(function () { burst(W * 0.30, H * 0.44, colors[1]); }, 760);
    setTimeout(function () { burst(W * 0.89, H * 0.60, colors[3]); }, 980);
  });

  $("#replay").addEventListener("click", function () {
    typingToken++;
    typedOnce = false;
    heartStarted = false;
    heartOn = false;
    replied = false;
    heartBeat = 1;
    $("#letterBody").innerHTML = "";
    $("#sign").classList.remove("in");
    $("#toFinale").hidden = true;
    $("#finaleCaption").classList.remove("swap");
    $("#heartBtn").style.animation = "";
    $("#finaleSmall").style.color = "";
    heartC.classList.remove("show");
    hctx.clearRect(0, 0, W, H);
    sparks.length = 0;
    go(1);
  });

  document.addEventListener("keydown", function (e) {
    const cur = $(".stage.active");
    if (!cur) return;
    const id = parseInt(cur.id.replace("stage-", ""), 10);
    if (e.key === "ArrowRight" || e.key === " " || e.key === "Enter") {
      if (id < 4) { e.preventDefault(); go(id + 1); }
    } else if (e.key === "ArrowLeft") {
      if (id > 1) { e.preventDefault(); go(id - 1); }
    }
  });

  /* ---------- 启动 ---------- */
  let resizeTimer = null;
  window.addEventListener("resize", function () {
    resize();
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function () { if (heartOn) buildHeart(); }, 180);
  });

  resize();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
